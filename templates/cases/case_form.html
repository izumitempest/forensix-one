{% extends 'base.html' %}

{% block title %}New Case - ForensixOne{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1 style="margin-bottom: 24px;">Start New Investigation</h1>
    
    <div class="card">
        <form method="post">
            {% csrf_token %}
            
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Case Name</label>
                <input type="text" name="name" required class="form-control" placeholder="e.g. Operation Deep Dive" maxlength="255">
                {% if form.name.errors %}<div style="color: #F87171; font-size: 0.8rem; margin-top: 4px;">{{ form.name.errors }}</div>{% endif %}
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Description</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Brief summary of the incident..."></textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px;">
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Priority</label>
                    <select name="priority" class="form-control">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div>
                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Case Type</label>
                    <select name="case_type" class="form-control">
                        <option value="criminal">Criminal</option>
                        <option value="civil">Civil</option>
                        <option value="internal">Internal Audit</option>
                        <option value="incident_response">Incident Response</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px;">
                <a href="{% url 'ui-case-list' %}" class="btn btn-outline" style="text-align: center;">Cancel</a>
                <button type="submit" class="btn">Create Case</button>
            </div>
        </form>
    </div>
</div>

<style>
    .form-control {
        width: 100%;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 12px;
        color: var(--text-main);
        font-family: inherit;
        box-sizing: border-box;
    }
    .form-control:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
</style>
{% endblock %}
