<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ForensixOne{% endblock %}</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      :root {
        /* HSL Palette */
        --bg-h: 222;
        --bg-s: 47%;
        --bg-l: 11%;
        --bg-color: hsl(var(--bg-h), var(--bg-s), var(--bg-l));

        --surface-h: 217;
        --surface-s: 33%;
        --surface-l: 17%;
        --surface-color: hsl(
          var(--surface-h),
          var(--surface-s),
          var(--surface-l)
        );

        --primary-h: 217;
        --primary-s: 91%;
        --primary-l: 60%;
        --primary-color: hsl(
          var(--primary-h),
          var(--primary-s),
          var(--primary-l)
        );

        --accent-h: 160;
        --accent-s: 84%;
        --accent-l: 39%;
        --accent-color: hsl(var(--accent-h), var(--accent-s), var(--accent-l));

        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: "Inter", sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar */
      .sidebar {
        width: 260px;
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(20px);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        padding: 24px;
        box-sizing: border-box;
      }

      .brand {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--primary-color);
        margin-bottom: 40px;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand span {
        color: #fff;
      }

      .nav-item {
        display: block;
        padding: 12px 16px;
        color: var(--text-muted);
        text-decoration: none;
        border-radius: 8px;
        margin-bottom: 4px;
        transition: all 0.2s ease;
        font-weight: 500;
      }

      .nav-item:hover,
      .nav-item.active {
        background: rgba(59, 130, 246, 0.1);
        color: var(--primary-color);
      }

      /* Main Content */
      .main-content {
        flex: 1;
        padding: 40px;
        overflow-y: auto;
        position: relative;
      }

      /* Glass Header */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }

      h1 {
        font-size: 2rem;
        margin: 0;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      h2 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
        color: #e2e8f0;
      }

      /* Components */
      .btn {
        background: var(--primary-color);
        color: #fff;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--border-color);
        color: var(--text-muted);
      }
      .btn-outline:hover {
        border-color: var(--text-main);
        color: var(--text-main);
      }

      .card {
        background: var(--surface-color);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 24px;
      }

      /* Tables */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th {
        text-align: left;
        color: var(--text-muted);
        font-weight: 500;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border-color);
      }
      td {
        padding: 16px;
        border-bottom: 1px solid rgba(51, 65, 85, 0.5);
        color: #e2e8f0;
      }
      tr:last-child td {
        border-bottom: none;
      }

      .status-badge {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
      }
      .status-running {
        background: rgba(59, 130, 246, 0.2);
        color: #60a5fa;
      }
      .status-completed {
        background: rgba(16, 185, 129, 0.2);
        color: #34d399;
      }
      .status-failed {
        background: rgba(239, 68, 68, 0.2);
        color: #f87171;
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <div class="sidebar">
      <a href="/" class="brand">Forensix<span>One</span></a>

      <nav>
        <a
          href="/"
          class="nav-item {% if request.path == '/' %}active{% endif %}"
          >Dashboard</a
        >
        <a
          href="{% url 'ui-case-list' %}"
          class="nav-item {% if '/cases/' in request.path %}active{% endif %}"
          >Cases</a
        >
        <a
          href="{% url 'ui-acquisition-list' %}"
          class="nav-item {% if '/acquisition/' in request.path %}active{% endif %}"
          >Acquisition</a
        >
        <a href="{% url 'ui-analysis-list' %}" class="nav-item {% if '/analysis/' in request.path %}active{% endif %}">Analysis</a>
        <a href="/timeline/" class="nav-item">Timeline</a>
        <a href="/reports/" class="nav-item">Reports</a>
        <div
          style="
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
          "
        >
          <a href="/admin/" class="nav-item">Admin Panel</a>
          <a href="#" class="nav-item">Settings</a>
        </div>
      </nav>
    </div>

    <div class="main-content">{% block content %} {% endblock %}</div>

    {% block extra_js %}{% endblock %}
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  </body>
</html>
